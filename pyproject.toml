[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quan-asr-server"
version = "1.0.0"
description = "OpenAI-compatible, streaming-capable ASR API server for QUAN-Transcribe"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "sea-g2p>=0.10.0",
    "quan-transcribe @ git+https://github.com/qnguyen3/QUAN-Transcribe",
]

[project.optional-dependencies]
grpc = ["grpcio>=1.60.0", "protobuf>=4.25.0"]
lm = ["kenlm"]
vad = ["silero-vad>=6.0", "onnxruntime>=1.16"]
test = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]

[project.scripts]
quan-asr-server = "app.cli:main"

[project.urls]
Model = "https://huggingface.co/qnguyen3/QUAN-Transcribe-1.0"
Upstream = "https://github.com/qnguyen3/QUAN-Transcribe"

[tool.setuptools]
packages = ["app", "app.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501", # long lines are handled by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is built around calls in argument defaults.
"app/server.py" = ["B008"]
"tests/*" = ["B008"]
# protoc-generated code: never hand-edited, so style rules do not apply.
"app/proto/*_pb2.py" = ["UP009", "I001", "F401", "E501"]
"app/proto/*_pb2_grpc.py" = ["I001", "F401", "E501"]

# The same backend definition as an InferenceBackendSource document.
#
# Use this variant when GPUStack is configured with a managed backend source
# (Settings -> Inference Backend Sources -> a FILE or URL source): point the
# source at this file, or at a URL serving it, and GPUStack materialises the
# backend for you and keeps it in sync.
#
# Differences from gpustack-backend.yaml:
#   * every version is declared as predefined via built_in_frameworks, because a
#     source document is authoritative for the versions it ships; GPUStack moves
#     the framework list into built_in_frameworks and clears custom_framework,
#     so both "cuda" and "cpu" are listed to expose the CPU profile too
#   * there is no enabled/is_built_in flag: a source cannot claim built-in status
apiVersion: gpustack.ai/v1
kind: InferenceBackendSource
metadata:
  name: quan-asr-custom
spec:
  content: |
    backend_name: QUAN-ASR-custom
    default_version: "1.0.0"
    health_check_path: /health
    description: >-
      QUAN-Transcribe-1.0 Vietnamese ASR with an OpenAI-compatible transcription
      API, SSE streaming and WebSocket live transcription. Ships a CUDA version
      and a CPU-only version.
    default_env:
      PRELOAD: "true"
      HF_HOME: /cache/huggingface
      LOG_LEVEL: info
    version_configs:
      "1.0.0":
        image_name: quan-asr:1.0.0
        built_in_frameworks: ["cuda"]
        run_command: >-
          --model-path {{model_path}}
          --served-model-name {{model_name}}
          --host {{worker_ip}}
          --port {{port}}
      "1.0.0-cpu":
        image_name: quan-asr:1.0.0
        built_in_frameworks: ["cpu"]
        env:
          DEVICE: cpu
          # CPU decoding is one FP32 GEMM pipeline per core, so coalescing buys
          # little throughput; keep the gather window short.
          MICROBATCH_SECONDS: "0.25"
          MICROBATCH_MAX_WAIT_MS: "10"
          # Bounded decode queue: a full queue returns 503 instead of growing
          # latency without limit. 0 disables the cap.
          MAX_QUEUE: "256"
          # Cap each forward pass at 30 s of audio so a long file cannot stall
          # a live session: the scheduler can preempt between launches.
          SUBBATCH_SECONDS: "30"
          # Call audio is mostly silence; VAD skips it and cuts on real pauses.
          USE_VAD: "true"
        run_command: >-
          --model-path {{model_path}}
          --served-model-name {{model_name}}
          --host {{worker_ip}}
          --port {{port}}

# GitLab CI for the QUAN-ASR image.
#
# Builds and pushes the container image to the GitLab Container Registry, and
# cuts a GitLab Release. There is deliberately no deploy stage: this image is
# pulled by GPUStack, not run from a compose file on a deploy host.
#
# Triggers: a tag matching v-<something>-release (e.g. v1.0.0-release).
# The build runs on the shared docker runner.

stages:
  - test
  - build-image
  - release

variables:
  # Pushed as $CI_REGISTRY_IMAGE/asr-engine:$CI_COMMIT_TAG and :latest
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/asr-engine"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  BUILDX_CACHE: "$CI_REGISTRY_IMAGE/asr-engine-cache:buildx"
  # kenlm has no wheel and is compiled from source inside the image. Set this to
  # "false" to skip it: the build gets much faster and the server then only does
  # greedy decoding (USE_LM must stay unset/false at runtime).
  INSTALL_LM: "true"
  # Base CUDA runtime the image is built on. Keep TORCH_INDEX in step with it.
  CUDA: "12.6.1"
  TORCH_INDEX: "https://download.pytorch.org/whl/cu126"
  PYTHON_VERSION: "3.11"

build_image:
  stage: build-image
  image: docker:28.3
  services:
    - docker:28.3-dind
  tags:
    - docker-execuse-150
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v-.*-release$/'
      when: on_success
    - when: never
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --use --name quan-builder --driver-opt image=moby/buildkit:v0.12.5 || docker buildx use quan-builder
  script:
    - |
      docker buildx build \
        --platform linux/amd64 \
        --build-arg CUDA=$CUDA \
        --build-arg TORCH_INDEX=$TORCH_INDEX \
        --build-arg PYTHON_VERSION=$PYTHON_VERSION \
        --build-arg INSTALL_LM=$INSTALL_LM \
        --cache-from=type=registry,ref=$BUILDX_CACHE \
        --cache-to=type=registry,mode=max,ref=$BUILDX_CACHE \
        -t "$IMAGE_NAME:$CI_COMMIT_TAG" \
        -t "$IMAGE_NAME:latest" \
        --push \
        -f Dockerfile .
    - echo "Pushed $IMAGE_NAME:$CI_COMMIT_TAG"
  after_script:
    - docker buildx rm quan-builder || true

# Unit tests use no torch and no model weights, so they run inside a plain
# Python image and finish in seconds. They run before the image build, on a tag
# and on a merge request, so a broken change cannot reach a release tag.
test:
  stage: test
  image: python:3.11-slim
  tags:
    - docker-execuse-150
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v-.*-release$/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  before_script:
    - apt-get update -qq && apt-get install -y -qq libsndfile1 > /dev/null
    - pip install --quiet --no-cache-dir fastapi "uvicorn[standard]" python-multipart numpy pytest httpx soundfile ruff
  script:
    - ruff check app tests scripts
    - pytest -q

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker-execuse-150
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v-.*-release$/'
      when: on_success
    - when: never
  script:
    - |
      PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$CI_COMMIT_TAG^" 2>/dev/null) || PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)

      echo "Previous reference point is $PREVIOUS_TAG"

      CHANGES=$(git log --pretty=format:'- %s' "$PREVIOUS_TAG".."$CI_COMMIT_TAG")
      echo "Changelog:"
      echo "$CHANGES"

      release-cli create \
        --name "$CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --ref "$CI_COMMIT_SHA" \
        --description "## Container image

\`$IMAGE_NAME:$CI_COMMIT_TAG\` (also tagged \`latest\`)

## Changelog

$CHANGES"
  environment:
    name: production
